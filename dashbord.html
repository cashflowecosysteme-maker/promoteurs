<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace — Cercle NyXia</title>
<link rel="icon" type="image/png" href="/FavIcon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1628; --side:#0B1224; --card:rgba(123,92,255,.06); --border:rgba(123,92,255,.15);
  --p:#7B5CFF; --p2:#5A6CFF; --t:#fff; --t2:#D6D9F0; --t3:#8891B8; --t4:#4a5278;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t2);font-family:Outfit,sans-serif;overflow:hidden}
#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.layout{position:relative;z-index:1;display:flex;height:100%}
.sidebar{
  width:280px;flex-shrink:0;background:rgba(11,18,36,.92);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto
}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px;color:#fff;font-weight:700}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid rgba(123,92,255,.4)}
.section-label{font-size:11px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.5px;padding:12px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;
  color:var(--t3);font-size:13px;font-weight:500;border:none;background:transparent;width:100%;text-align:left
}
.nav-item:hover{background:rgba(123,92,255,.08);color:var(--t2)}
.nav-item.active{background:rgba(123,92,255,.16);color:#fff}
.nav-item img.av{width:32px;height:32px;border-radius:50%;object-fit:cover}
.nav-item .txt{display:flex;flex-direction:column;min-width:0}
.nav-item .name{font-weight:600;color:inherit;font-size:13px}
.nav-item .sub{font-size:11px;color:var(--t4);font-weight:400}
.divider{height:1px;background:var(--border);margin:10px 6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.main iframe{flex:1;width:100%;border:none;background:transparent}
.user-card{margin-top:auto;padding:12px;border-radius:12px;background:rgba(123,92,255,.08);display:flex;gap:10px;align-items:center}
.user-card .av{width:36px;height:36px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.user-card .meta{min-width:0}
.user-card .un{font-size:13px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-card .up{font-size:11px;color:var(--t4)}
.logout{margin-left:auto;background:none;border:none;color:var(--t4);cursor:pointer;font-size:12px}
.logout:hover{color:#fff}
@media(max-width:800px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-105%);transition:.25s}
  .sidebar.open{transform:none}
}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="/NyXia.png" alt=""> <span>Mon espace · Cercle</span></div>

    <div class="section-label">Mes conversations</div>
    <button type="button" class="nav-item active" id="nav-diane" onclick="openPage('/chat-diane.html','nav-diane')">
      <img class="av" src="/Diane.png" alt=""><span class="txt"><span class="name">Diane</span><span class="sub">Cercles & entraide</span></span>
    </button>
    <button type="button" class="nav-item" id="nav-nyxia" onclick="openPage('/chat-nyxia.html','nav-nyxia')">
      <img class="av" src="/NyXia.png" alt=""><span class="txt"><span class="name">NyXia</span><span class="sub">Orientation & technique</span></span>
    </button>
    <button type="button" class="nav-item" id="nav-eric" onclick="openPage('/chat-eric.html','nav-eric')">
      <img class="av" src="/Eric.png" alt=""><span class="txt"><span class="name">Éric</span><span class="sub">Communication</span></span>
    </button>

    <div class="divider"></div>
    <div class="section-label">Mon cercle</div>
    <button type="button" class="nav-item" id="nav-home" onclick="openPage('/promo-home.html','nav-home')">
      <span class="txt"><span class="name">📊 Tableau de bord</span><span class="sub">Gains & activité</span></span>
    </button>
    <button type="button" class="nav-item" id="nav-lien" onclick="openPage('/promo-lien.html','nav-lien')">
      <span class="txt"><span class="name">🔗 Mon lien d’équipe</span><span class="sub">Créer mon cercle d’entraide</span></span>
    </button>
    <button type="button" class="nav-item" id="nav-phare" onclick="openPage('/promo-phare.html','nav-phare')">
      <span class="txt"><span class="name">⭐ Produit phare</span><span class="sub">NyXia · nyxia.top</span></span>
    </button>
    <button type="button" class="nav-item" id="nav-rep" onclick="openPage('/promo-repertoire.html','nav-rep')">
      <span class="txt"><span class="name">📦 Produits à partager</span><span class="sub">Choisir dans le Répertoire</span></span>
    </button>

    <div class="divider"></div>
    <div class="section-label">Outils</div>
    <button type="button" class="nav-item" id="nav-msg" onclick="openPage('/messagerie.html','nav-msg')">
      <span class="txt"><span class="name">💬 Messagerie</span></span>
    </button>
    <button type="button" class="nav-item" id="nav-media" onclick="openPage('/medias.html','nav-media')">
      <span class="txt"><span class="name">🛠️ Médias</span><span class="sub">Images, sons, vidéos</span></span>
    </button>

    <div class="user-card">
      <div class="av" id="uav">M</div>
      <div class="meta">
        <div class="un" id="uname">…</div>
        <div class="up">Cercle d’entraide</div>
      </div>
      <button type="button" class="logout" id="logout">Sortir</button>
    </div>
  </aside>
  <main class="main">
    <iframe id="frame" src="/chat-diane.html" title="Contenu"></iframe>
  </main>
</div>
<script src="/starry-bg.js" defer></script>
<script>
(function(){
  var TOKEN = sessionStorage.getItem('nyxia_token') || '';
  if (!TOKEN) { location.href = '/login.html'; return; }

  function setActive(id){
    document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); });
    var el = document.getElementById(id); if (el) el.classList.add('active');
  }
  window.openPage = function(url, navId){
    setActive(navId);
    var f = document.getElementById('frame');
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    f.src = url + sep + 't=' + encodeURIComponent(TOKEN) + '&_=' + Date.now();
  };

  document.getElementById('logout').onclick = function(){
    fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN})})
      .finally(function(){ sessionStorage.removeItem('nyxia_token'); location.href='/login.html'; });
  };

  fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.valid) { location.href='/login.html'; return; }
      var name = d.firstname || d.full_name || 'Membre';
      document.getElementById('uname').textContent = name;
      document.getElementById('uav').textContent = name.charAt(0).toUpperCase();
      window.__CODE = d.code || '';
      window.__NAME = name;
    })
    .catch(function(){ location.href='/login.html'; });
})();
</script>
</body>
</html>
