<!DOCTYPE html>
<html lang="fr"><head>
<script>
(function(){
  try {
    var q = new URLSearchParams(location.search);
    var t = q.get('t');
    if (t) sessionStorage.setItem('nyxia_token', t);
  } catch (e) {}
})();
</script>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Cercle NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1628;--card:rgba(123,92,255,.06);--border:rgba(123,92,255,.15);--p:#7B5CFF;--p2:#5A6CFF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--gold:#F4C842}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--t2);padding:28px;min-height:100vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff;margin-bottom:6px}
.sub{color:var(--t3);font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat b{display:block;font-size:22px;color:#fff;margin-top:4px}
.stat.money b{color:var(--green)}
.stat span{font-size:12px;color:var(--t3)}
.lien{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lien code{flex:1;min-width:180px;padding:12px 14px;border-radius:12px;background:rgba(15,28,63,.5);border:1px solid var(--border);color:#fff;font-size:13px;word-break:break-all}
.btn{padding:10px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-family:Outfit,sans-serif}
.btn-ghost{background:rgba(123,92,255,.12);border:1px solid rgba(123,92,255,.25);color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:50px;background:rgba(123,92,255,.2);color:#c4b5fd;font-size:12px;margin-left:8px}
</style>
<script>
var TOKEN=(function(){
  try {
    var q=new URLSearchParams(location.search);
    var t=q.get('t');
    if(t){ sessionStorage.setItem('nyxia_token', t); return t; }
  } catch(e) {}
  return sessionStorage.getItem('nyxia_token')||'';
})();
async function api(p,m,b){var o={method:m||'GET',headers:{'Content-Type':'application/json','X-Cercle-Token':TOKEN}};if(b||m==='POST')o.body=JSON.stringify(Object.assign({token:TOKEN},b||{}));var r=await fetch(p,o);return r.json().catch(function(){return{}})}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return Number(n||0).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2})+' $'}
</script>
</head><body><style id="nyxia-original-background">body{background:#0A1628!important;isolation:isolate}#starry-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}</style><canvas id="starry-canvas" aria-hidden="true"></canvas>
<h1 id="hello">Bienvenue</h1>
<p class="sub">Voici un aperçu de ton activité dans le Cercle</p>
<div class="stats">
  <div class="stat money"><span>Gains totaux</span><b id="gains">0,00 $</b></div>
  <div class="stat"><span>En attente</span><b id="pending" style="color:var(--gold)">0,00 $</b></div>
  <div class="stat"><span>Ton cercle</span><b id="cercle">0</b></div>
  <div class="stat"><span>Clics sur ton lien</span><b id="clics">0</b></div>
</div>
<p id="statsError" role="alert" style="color:var(--gold)" hidden></p>
<div class="card" id="myCommissionCard" hidden><h2 style="margin:0 0 12px;font-size:16px;color:#ffe48a;font-weight:400">Mes pourcentages de commission</h2><div id="myCommissionRates"></div></div>
<div class="card" id="byProductCard" style="display:none">
  <h2 style="margin:0 0 10px;font-size:15px">Mes gains, produit par produit</h2>
  <div id="byProductList" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<div class="card">
  <h2 style="margin:0 0 12px;font-size:15px;color:#fff">Mes ventes et commissions</h2>
  <div id="salesList" style="display:flex;flex-direction:column;gap:10px">Chargement…</div>
</div>
<div class="card">
  <h2 style="margin:0 0 12px;font-size:15px;color:#fff">Mes partenaires NyXia et ceux de mon équipe</h2>
  <div id="recruitsList" style="display:flex;flex-direction:column;gap:10px">Chargement…</div>
</div>

<script>
(async function(){
  var d=await api('/api/check-auth','POST',{token:TOKEN});
  if(!d.valid){ var err=document.getElementById('statsError');err.hidden=false;err.textContent='Session expirée — reconnecte-toi.';document.getElementById('salesList').textContent='Session expirée.';document.getElementById('recruitsList').textContent='Session expirée.';return; }
  if(d.firstname) document.getElementById('hello').textContent='Bienvenue, '+d.firstname+' 👋';
  var code=(d.code||d.affiliate_code||'').toString().trim().toUpperCase();
  try {
    var st=await api('/api/stats','POST',{token:TOKEN});
    if(!st.success) throw new Error(st.error||'Impossible de charger tes ventes.');
    document.getElementById('gains').textContent=money(st.gains||0);
    document.getElementById('pending').textContent=money(st.pending||0);
    var byP=st.gains_by_product||[];
    if(byP.length>0){
      document.getElementById('byProductCard').style.display='block';
      document.getElementById('byProductList').innerHTML=byP.map(function(p){
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(123,92,255,.06);border-radius:10px">'
          +'<span>'+esc(p.title||'Produit')+' <span style="opacity:.6;font-size:12px">('+p.ventes+' vente'+(p.ventes>1?'s':'')+')</span></span>'
          +'<span><b>'+money(p.paid)+'</b>'+(p.pending>0?' <span style="color:var(--gold);font-size:12px">+'+money(p.pending)+' en attente</span>':'')+'</span>'
          +'</div>';
      }).join('');
    }
    var settings=st.commission_settings||{},configured=settings.products||[];
    var commissionNames=['Partenaire NyXia — Prime de recommandation','Chef d’équipe',"Bonus d'équipe"];
    var rate=function(n){return Number(n).toLocaleString('fr-CA',{maximumFractionDigits:2})+' %'};
    document.getElementById('myCommissionCard').hidden=false;
    document.getElementById('myCommissionRates').innerHTML=(settings.closer_active?'<p style="font-size:16px;color:#ffe48a;margin-bottom:14px">Ta rémunération comme Directeur ou Directrice du développement commercial NyXia pour une vente conclue : '+esc(rate(settings.closer_conclusion_rate))+'</p>':'')+(configured.length?configured.map(function(p){
      var shownRates=p.via_closer&&!settings.closer_active?p.closer_referral_rates:p.rates;
      var circles=shownRates.map(function(n,i){return commissionNames[i]+' : '+rate(n)}).join(' · ');
      return '<div style="padding:12px 0;border-top:1px solid var(--border)"><p style="color:#fff;font-size:15px">'+esc(p.title)+'</p><p style="margin-top:6px;color:#d6d9f0;font-size:12px">'+(p.via_closer&&!settings.closer_active?'Tes primes de recommandation':p.personal?'Tes taux personnels configurés':'Tes taux selon le produit')+'</p><p style="color:#ffe48a;font-size:15px;margin-top:4px">'+esc(circles)+'</p>'+'</div>';
    }).join(''):'Aucun taux de produit configuré pour le moment.');
    var sales=st.sales||[];
    document.getElementById('salesList').innerHTML=sales.length?sales.map(function(s){
      var date=new Date(s.created_at);
      var label=s.status==='paid'?'Commission payée':s.status==='pending'?'Commission en attente':s.status||'Statut non précisé';
      return '<div style="padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(123,92,255,.06)">'
        +'<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong style="color:#fff">'+esc(s.product_title)+'</strong><strong style="color:var(--gold)">'+esc(money(s.amount))+' '+esc(s.currency||'CAD')+'</strong></div>'
        +'<p style="margin-top:6px;font-size:13px">Client : '+esc(s.buyer_name||s.buyer_email||'Nom non transmis avec la vente')+'</p>'
        +'<p style="margin-top:6px;font-size:12px;color:var(--t3)">'+esc(isNaN(date.getTime())?'Date non précisée':date.toLocaleString('fr-CA'))+' · '+esc(label)+' · '+esc(Number(s.level)===0?'Conclusion de vente — Directeur ou Directrice du développement commercial NyXia':({1:'Partenaire NyXia — Prime de recommandation',2:'Chef d’équipe',3:"Bonus d'équipe"})[Number(s.level)]||'Origine non précisée')+'</p>'
        +(s.rate_percent!=null?'<p style="margin-top:6px;font-size:14px;color:#ffe48a">Taux appliqué à cette commission : '+esc(rate(s.rate_percent))+'</p>':'')
        +(s.sale_amount!=null?'<p style="margin-top:4px;font-size:12px">Base de calcul de cette commission : '+esc(money(s.sale_amount))+' '+esc(s.currency||'CAD')+'</p>':'')
        +'</div>';
    }).join(''):'Aucune vente avec une commission attribuée à ton compte pour le moment.';
    var recruits=st.recruits||[];
    document.getElementById('recruitsList').innerHTML=recruits.length?recruits.map(function(r){
      var date=new Date(r.created_at);
      return '<div style="padding:12px;border:1px solid var(--border);border-radius:12px;background:rgba(123,92,255,.06)"><strong style="color:#fff">'+esc(r.full_name||'Membre')+'</strong>'
        +'<p style="margin-top:6px;font-size:12px;color:var(--t3)">'+esc(Number(r.level)===1?'Partenaire NyXia recommandé par toi':'Partenaire NyXia recommandé par ton équipe')+' · '+esc(isNaN(date.getTime())?'Date non précisée':date.toLocaleString('fr-CA'))+'</p>'
        +(Number(r.level)>1&&r.sponsor_name?'<p style="margin-top:4px;font-size:12px">Recommandé par '+esc(r.sponsor_name)+'</p>':'')+'</div>';
    }).join(''):'Aucun partenaire NyXia recommandé par toi ou ton équipe pour le moment.';
    document.getElementById('cercle').textContent=String(st.team_total||st.team_n1||0);
    document.getElementById('clics').textContent = st.success && (!code || String(st.code || '').toUpperCase() === String(code).toUpperCase()) ? String(st.clicks || 0) : '—';
  } catch(e) {
    var error=document.getElementById('statsError');error.hidden=false;error.textContent=e.message||'Impossible de charger tes ventes.';
    ['gains','pending','cercle','clics'].forEach(function(id){document.getElementById(id).textContent='—'});
    document.getElementById('salesList').textContent='Les ventes ne peuvent pas être affichées actuellement.';
    document.getElementById('recruitsList').textContent='Les partenaires de ton équipe ne peuvent pas être affichés actuellement.';
  }
})();
</script>
<script src="/starry-bg.js" defer></script></body></html>
