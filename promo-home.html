<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — Cercle NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1628;--card:rgba(123,92,255,.06);--border:rgba(123,92,255,.15);--p:#7B5CFF;--p2:#5A6CFF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676;--gold:#F4C842}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--t2);padding:28px;min-height:100vh}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff;margin-bottom:6px}
.sub{color:var(--t3);font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat b{display:block;font-size:22px;color:#fff;margin-top:4px}
.stat.money b{color:var(--green)}
.stat span{font-size:12px;color:var(--t3)}
.lien{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lien code{flex:1;min-width:180px;padding:12px 14px;border-radius:12px;background:rgba(15,28,63,.5);border:1px solid var(--border);color:#fff;font-size:13px;word-break:break-all}
.btn{padding:10px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-family:Outfit,sans-serif}
.btn-ghost{background:rgba(123,92,255,.12);border:1px solid rgba(123,92,255,.25);color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:50px;background:rgba(123,92,255,.2);color:#c4b5fd;font-size:12px;margin-left:8px}
</style>
<script>
var TOKEN=sessionStorage.getItem('nyxia_token')||'';
async function api(p,m,b){var o={method:m||'GET',headers:{'Content-Type':'application/json','X-Cercle-Token':TOKEN}};if(b||m==='POST')o.body=JSON.stringify(Object.assign({token:TOKEN},b||{}));var r=await fetch(p,o);return r.json().catch(function(){return{}})}
function money(n){return Number(n||0).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2})+' $'}
</script>
</head><body>
<h1 id="hello">Bienvenue</h1>
<p class="sub">Voici un aperçu de ton activité dans le Cercle</p>
<div class="stats">
  <div class="stat money"><span>Gains totaux</span><b id="gains">0,00 $</b></div>
  <div class="stat"><span>En attente</span><b id="pending" style="color:var(--gold)">0,00 $</b></div>
  <div class="stat"><span>Ton cercle</span><b id="cercle">0</b></div>
  <div class="stat"><span>Clics</span><b id="clics">0</b></div>
</div>
<div class="card">
  <div style="font-weight:600;color:#fff;margin-bottom:8px">🔗 Ton lien d’équipe <span class="badge" id="codeBadge">—</span></div>
  <div class="lien">
    <code id="lien">Chargement…</code>
    <button type="button" class="btn btn-ghost" id="copy">Copier</button>
  </div>
  <p class="sub" style="margin:10px 0 0">Ce lien contient <strong style="color:#fff">ton empreinte unique</strong>. Toute personne qui s’inscrit via ce lien rejoint <strong style="color:#fff">ton</strong> cercle.</p>
</div>
<script>
(async function(){
  var d=await api('/api/check-auth','POST',{token:TOKEN});
  if(!d.valid){ document.getElementById('lien').textContent='Session expirée — reconnecte-toi.'; return; }
  if(d.firstname) document.getElementById('hello').textContent='Bienvenue, '+d.firstname+' 👋';
  var code=(d.code||d.affiliate_code||'').toString().trim().toUpperCase();
  if(!code){
    document.getElementById('lien').textContent='Code manquant — contacte le support.';
    document.getElementById('codeBadge').textContent='sans code';
    return;
  }
  document.getElementById('codeBadge').textContent='code '+code;
  var lien='https://nyxia.top/r/'+code;
  document.getElementById('lien').textContent=lien;
  document.getElementById('copy').onclick=function(){
    navigator.clipboard.writeText(lien);
    this.textContent='Copié ✓';
    var b=this; setTimeout(function(){ b.textContent='Copier'; },1500);
  };
  try {
    var st=await api('/api/stats','POST',{token:TOKEN});
    document.getElementById('gains').textContent=money(st.gains||0);
    document.getElementById('pending').textContent=money(st.pending||0);
    document.getElementById('cercle').textContent=String(st.team_total||st.team_n1||0);
    document.getElementById('clics').textContent=String(st.clicks||0);
  } catch(e) {}
})();
</script>
</body></html>
