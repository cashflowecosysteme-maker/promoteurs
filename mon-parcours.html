<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon parcours</title><style>body{margin:0;padding:24px;background:#0A1628;color:#D6D9F0;font:16px/1.5 system-ui;isolation:isolate}#starry-canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}h1{color:#F4C842}.trainer-card{padding:20px;margin:18px 0;border:1px solid rgba(214,217,240,.2);border-radius:18px;background:rgba(15,28,63,.8)}.trainer-head{display:flex;align-items:center;gap:14px}.trainer-head img{width:64px;height:64px;border-radius:50%}.trainer-head span{display:block}.formation-row{display:flex;width:100%;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;padding:16px;border:1px solid rgba(214,217,240,.2);border-radius:14px;background:rgba(255,255,255,.04);color:#D6D9F0;text-align:left;cursor:pointer}.formation-main small{display:block;margin-top:6px}.formation-row:disabled{opacity:.55;cursor:default}.completed{color:#00E676}.formation-status{white-space:nowrap}.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}.shop-card{border:1px solid rgba(214,217,240,.2);border-radius:18px;overflow:hidden;background:rgba(15,28,63,.8)}.shop-card img{width:100%;aspect-ratio:16/9;object-fit:cover}.shop-body{padding:18px}.shop-button{display:inline-block;padding:10px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(214,217,240,.25);border-radius:12px;backdrop-filter:blur(12px);color:#D6D9F0;font:inherit;cursor:pointer;text-decoration:none}.shop-detail{margin:auto;padding:24px;width:min(680px,90vw);max-height:85vh;overflow:auto;border:1px solid rgba(214,217,240,.25);border-radius:20px;background:#0F1C3F;color:#D6D9F0}.shop-detail::backdrop{background:rgba(4,8,18,.8)}.shop-detail img{width:100%;border-radius:14px}.shop-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}</style></head><body><canvas id="starry-canvas" aria-hidden="true"></canvas><h1>🎓 Mon parcours</h1><p>Retrouve tes Formations vivantes et reprends avec ton personnage à l’étape où tu en es.</p><div id="formation-trainers"></div><section style="margin-top:32px"><h2>✨ La boutique du Cercle</h2><p>Découvre les produits et les offres du Cercle d’entraide.</p><input id="shop-search" type="search" placeholder="Rechercher un produit" aria-label="Rechercher un produit" style="padding:12px;border-radius:12px;background:#0F1C3F;color:#D6D9F0;border:1px solid rgba(214,217,240,.25);margin-bottom:18px"><p id="shop-status" role="status">Chargement des produits…</p><div id="shop-products" class="shop-grid"></div></section><dialog id="shop-detail" class="shop-detail"><button class="shop-button" id="shop-close" style="float:right" aria-label="Fermer">×</button><h2 id="shop-title"></h2><img id="shop-image" alt=""><p id="shop-description"></p><div class="shop-actions"><a id="shop-offer" class="shop-button" target="_blank" rel="noopener">Voir l’offre</a><a class="shop-button" href="https://www.universnyxia.top/nyxia/cercledentraide" target="_blank" rel="noopener">Rejoindre le Cercle</a><a class="shop-button" href="https://promoteurs.nyxia.top/login.html" target="_blank" rel="noopener">Déjà membre ?</a></div></dialog><script src="/starry-bg.js" defer></script><script>
var parcoursToken=new URLSearchParams(location.search).get('t')||sessionStorage.getItem('nyxia_token')||'';
function parcoursEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function formationStatusLabel(f){
 if(f.status==='completed')return'<span class="formation-status completed">✓ Terminée</span>';
 if(f.status==='active')return'<span class="formation-status active">'+(f.hasProgress?'▶ En cours':'▶ Disponible')+'</span>';
 return'<span class="formation-status locked">🔒 À venir</span>';
}
function renderParcoursFormations(data){
 var host=document.getElementById('formation-trainers');if(!host)return;
 var trainers=Array.isArray(data&&data.trainers)?data.trainers:[];
 if(!trainers.length){host.innerHTML='<div class="empty">Aucune Formation Vivante n’est encore publiée dans ce portail.</div>';return}
 host.innerHTML=trainers.map(function(t){
   var avatar=t.image?'<img src="'+parcoursEsc(t.image)+'" alt="">':'<span class="trainer-fallback">✦</span>';
   var rows=(t.formations||[]).map(function(f){
     var disabled=f.status==='locked';
     return '<button type="button" class="formation-row '+parcoursEsc(f.status||'')+'" data-agent="'+parcoursEsc(t.agent)+'" data-formation="'+parcoursEsc(f.id)+'" data-status="'+parcoursEsc(f.status||'')+'" '+(disabled?'disabled aria-disabled="true"':'')+'>'+
       '<span class="formation-main"><strong>'+parcoursEsc(f.titre||'Formation')+'</strong>'+(f.description?'<small>'+parcoursEsc(f.description)+'</small>':'')+'</span>'+
       formationStatusLabel(f)+'<span class="formation-arrow">'+(disabled?'':'›')+'</span></button>';
   }).join('');
   return '<article class="trainer-card"><div class="trainer-head">'+avatar+'<div><strong>'+parcoursEsc(t.name||t.agent)+'</strong><span>'+parcoursEsc(t.role||'Formateur·rice')+'</span></div></div><div class="formation-list">'+rows+'</div></article>';
 }).join('');
 host.querySelectorAll('[data-formation]:not([disabled])').forEach(function(btn){
   btn.addEventListener('click',function(){
     try{window.parent.postMessage({type:'nyxia_open_formation',agent:btn.dataset.agent,formationId:btn.dataset.formation,status:btn.dataset.status},location.origin)}catch(_){}
   });
 });
}
function loadParcoursFormations(){
 var host=document.getElementById('formation-trainers');if(host)host.innerHTML='<div class="loading">Ton parcours de formation apparaît…</div>';
 fetch('/api/parcours/formations?token='+encodeURIComponent(parcoursToken),{cache:'no-store'})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})})
  .then(function(res){if(!res.ok)throw Error(res.data.error||'Parcours indisponible.');renderParcoursFormations(res.data)})
  .catch(function(e){if(host)host.innerHTML='<div class="error">'+parcoursEsc(e.message)+'</div>'});
}
window.addEventListener('message',function(e){if(e.data&&e.data.type==='nyxia_refresh_parcours')loadParcoursFormations()});
document.addEventListener('DOMContentLoaded',loadParcoursFormations);

</script><script>
(function(){const grid=document.getElementById('shop-products'),status=document.getElementById('shop-status'),dialog=document.getElementById('shop-detail');let products=[];
function url(value){try{const u=new URL(value);return /^https?:$/.test(u.protocol)?u.href:null;}catch(e){return null;}}
function open(p){document.getElementById('shop-title').textContent=p.title||'Produit';document.getElementById('shop-description').textContent=p.description_long||p.description_short||'';const img=document.getElementById('shop-image'),src=url(p.image_url);img.hidden=!src;if(src){img.src=src;img.alt=p.title||'';}const offer=document.getElementById('shop-offer'),link=url(p.affiliate_link);offer.hidden=!link;if(link)offer.href=link;dialog.showModal();}
function render(){grid.replaceChildren();const q=document.getElementById('shop-search').value.trim().toLowerCase();const list=products.filter(p=>[p.title,p.description_short].join(' ').toLowerCase().includes(q));status.textContent=list.length?'':(products.length?'Aucun produit ne correspond à cette recherche.':'Aucun produit publié pour le moment.');for(const p of list){const card=document.createElement('article');card.className='shop-card';const src=url(p.image_url);if(src){const img=document.createElement('img');img.src=src;img.alt=p.title||'';img.loading='lazy';card.append(img);}const body=document.createElement('div');body.className='shop-body';const title=document.createElement('h3');title.textContent=p.title||'Produit';const desc=document.createElement('p');desc.textContent=p.description_short||'';const button=document.createElement('button');button.className='shop-button';button.textContent='En Savoir Plus';button.onclick=()=>open(p);body.append(title,desc,button);card.append(body);grid.append(card);}}
document.getElementById('shop-search').addEventListener('input',render);document.getElementById('shop-close').onclick=()=>dialog.close();
async function load(){try{let r=await fetch('https://repertoire.nyxia.top/api/repertoire');if(!r.ok)throw Error();const d=await r.json();products=d.products||[];render();}catch(e){try{const r=await fetch('/api/repertoire');if(!r.ok)throw Error();const d=await r.json();products=d.products||[];render();}catch(e){status.textContent='La boutique est indisponible pour le moment. Réessaie dans quelques instants.';}}}load();})();
</script></body></html>
