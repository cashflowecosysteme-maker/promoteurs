<!doctype html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Créer mon nouveau mot de passe | Cercle d’entraide</title><link rel="icon" href="/FavIcon.png"><style>
:root{color-scheme:dark;--night:#0A1628;--violet:#7b5cff;--lavender:#a78bfa;--gold:#F4C842}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#f4efff;background:#0A1628}
main{width:min(100%,460px);border:1px solid rgba(123,92,255,.25);border-radius:22px;padding:clamp(24px,6vw,40px);background:rgba(15,28,63,.94);box-shadow:0 22px 70px #0009,0 0 45px #7b5cff21;text-align:center}
.logo{width:88px;height:88px;object-fit:contain;margin-bottom:8px}h1{font:700 clamp(26px,5vw,32px)/1.15 Georgia,serif;margin:0 0 12px;color:var(--gold)}p{color:#d3c8ea;margin:0 0 24px}form{text-align:left}label{font-size:14px;display:block;margin:14px 0 7px;font-weight:650}input{width:100%;min-height:48px;border-radius:10px;border:1px solid rgba(123,92,255,.3);background:#0F1C3F;color:white;padding:12px 14px;font-size:16px}input:focus{outline:2px solid var(--lavender);outline-offset:2px}button{width:100%;min-height:52px;margin-top:22px;border:1px solid #ffe5a4;border-radius:11px;background:linear-gradient(115deg,#a66b10,#f0c258 36%,#fff0aa 55%,#bd7b13);color:#110c20;font:800 16px system-ui;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.hint{font-size:13px;color:#ac9cc8;margin-top:8px}.notice{margin:18px 0 0;border-radius:10px;padding:12px;text-align:left;display:none}.notice.error{display:block;background:#48202b;color:#ffdae1}.notice.success{display:block;background:#15372f;color:#d9fff2}a{color:#d3bdff}footer{margin-top:22px;font-size:14px;color:#aea0ca}
canvas#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}main{position:relative;z-index:1}</style></head><body><canvas id="starry-canvas" aria-hidden="true"></canvas><main><img class="logo" src="/NyXia.png" alt="NyXia"><h1>Créer mon nouveau mot de passe</h1><p>Choisis ton nouveau mot de passe pour accéder au Cercle d’entraide.</p><form id="form"><label for="password">Mon nouveau mot de passe</label><input id="password" type="password" autocomplete="new-password" minlength="10" required><label for="confirm">Confirmer mon nouveau mot de passe</label><input id="confirm" type="password" autocomplete="new-password" minlength="10" required><div class="hint">10 caractères minimum.</div><button id="submitBtn">Enregistrer mon mot de passe</button><div id="status" class="notice" role="status" aria-live="polite"></div></form><footer><a href="/login.html">Retour à la connexion</a> · <a href="/mot-de-passe-oublie.html">Mot de passe oublié ?</a></footer></main><script>
const mode='reset',form=document.getElementById('form'),btn=document.getElementById('submitBtn'),status=document.getElementById('status');
const url=new URL(location.href),token=mode==='change'?(sessionStorage.getItem('nyxia_token')||''):(url.searchParams.get('token')||'');
function message(t,k){status.textContent=t;status.className='notice '+k;}
if(mode==='change'&&!token) location.replace('/login.html');
if(mode==='reset'){history.replaceState(null,'','/reinitialiser-mot-de-passe.html');if(!token){btn.disabled=true;message('Lien absent. Demande un nouveau lien depuis « Mot de passe oublié ? ».','error');}}
form.addEventListener('submit',async e=>{e.preventDefault();const payload={token};if(mode==='forgot')payload.email=document.getElementById('email').value.trim();else{payload.password=document.getElementById('password').value;if(payload.password!==document.getElementById('confirm').value){message('Les deux mots de passe ne correspondent pas.','error');return;}if(mode==='change')payload.currentPassword=document.getElementById('currentPassword').value;}
btn.disabled=true;message('Un instant…','success');try{const res=await fetch('/api/password/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(!res.ok||!data.success){if(res.status===401&&mode==='change'){sessionStorage.removeItem('nyxia_token');location.replace('/login.html');return;}throw new Error(data.error||'Une erreur est survenue.');}
if(mode==='forgot'){message('Si un compte correspond à ce courriel, tu recevras un lien pour choisir ton nouveau mot de passe. Vérifie aussi tes courriels indésirables.','success');btn.disabled=false;}else{form.reset();message('Ton mot de passe est modifié ! Tu vas être redirigé vers la page de connexion…','success');sessionStorage.removeItem('nyxia_token');setTimeout(()=>location.replace('/login.html'),1200);}}catch(err){message(err.message,'error');btn.disabled=false;}});
</script><script src="/starry-bg.js" defer></script></body></html>
