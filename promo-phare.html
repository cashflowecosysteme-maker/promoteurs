<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produit phare — NyXia</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1628;--card:rgba(123,92,255,.06);--border:rgba(123,92,255,.15);--p:#7B5CFF;--p2:#5A6CFF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--t2);padding:28px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
h1{font-family:'Space Grotesk',sans-serif;font-size:22px;color:#fff;margin-bottom:6px}
.sub{color:var(--t3);font-size:13px;margin-bottom:16px}
.lien{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}
code{flex:1;min-width:180px;padding:12px 14px;border-radius:12px;background:rgba(15,28,63,.5);border:1px solid var(--border);color:#fff;font-size:13px;word-break:break-all}
.btn{padding:10px 16px;border-radius:12px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-family:Outfit,sans-serif;text-decoration:none;display:inline-block}
.btn-ghost{background:rgba(123,92,255,.12);border:1px solid rgba(123,92,255,.25);color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:50px;background:rgba(123,92,255,.2);color:#c4b5fd;font-size:12px}
</style>
</head><body>
<h1>⭐ Produit phare — NyXia</h1>
<p class="sub">Quand quelqu’un arrive par <b style="color:#fff">ton</b> lien, le suivi te revient.</p>
<div class="card">
  <div style="font-weight:600;color:#fff;margin-bottom:6px">Ton lien NyXia <span class="badge" id="codeBadge">—</span></div>
  <div class="lien">
    <code id="lien">Chargement…</code>
    <button type="button" class="btn btn-ghost" id="copy">Copier</button>
  </div>
  <p class="sub">Page de destination : nyxia.top avec <strong style="color:#fff">ton code</strong></p>
  <a class="btn" id="open" href="#" target="_blank" rel="noopener">Ouvrir mon lien</a>
</div>
<script>
var TOKEN=sessionStorage.getItem('nyxia_token')||'';
(async function(){
  var r=await fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json','X-Cercle-Token':TOKEN},body:JSON.stringify({token:TOKEN})});
  var d=await r.json().catch(function(){return{}});
  var code=(d.code||d.affiliate_code||'').toString().trim().toUpperCase();
  if(!code){ document.getElementById('lien').textContent='Code manquant — reconnecte-toi.'; return; }
  document.getElementById('codeBadge').textContent=code;
  var lien='https://nyxia.top/r/'+code;
  document.getElementById('lien').textContent=lien;
  document.getElementById('open').href=lien;
  document.getElementById('copy').onclick=function(){
    navigator.clipboard.writeText(lien);
    this.textContent='Copié ✓';
    var b=this; setTimeout(function(){ b.textContent='Copier'; },1500);
  };
})();
</script>
</body></html>
