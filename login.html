<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Cercle NyXia</title>
<link rel="icon" type="image/png" href="/FavIcon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a18;--p:#7B5CFF;--p2:#5A6CFF;--pl:#a78bfa;--t2:#b9b3d6;--t3:#7c73a0;--border:rgba(123,92,255,.2);--green:#34d399;--err:#ff7b8a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--t2);min-height:100vh}
#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:48px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;text-decoration:none;font-weight:600;margin-bottom:28px}
.brand img{width:48px;height:48px;border-radius:50%;border:2px solid rgba(123,92,255,.45);object-fit:cover}
.card{background:rgba(14,20,48,.88);border:1px solid var(--border);border-radius:20px;padding:28px 24px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.85rem;color:#fff;text-align:center;margin-bottom:6px}
.sub{text-align:center;font-size:.9rem;color:var(--t3);margin-bottom:22px}
label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);margin:12px 0 6px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(6,10,24,.6);color:#fff;font-family:Outfit,sans-serif;font-size:.95rem;outline:none}
input:focus{border-color:var(--p)}
.btn{width:100%;margin-top:18px;padding:14px 16px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:.95rem;font-family:Outfit,sans-serif}
.btn:disabled{opacity:.55;cursor:not-allowed}
.msg{margin-top:12px;font-size:.88rem;display:none;text-align:center}
.msg.ok{display:block;color:var(--green)}.msg.err{display:block;color:var(--err)}
.foot{margin-top:18px;text-align:center;font-size:.85rem;color:var(--t3)}
.foot a{color:var(--pl)}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="wrap">
  <a class="brand" href="/"><img src="/NyXia.png" alt="NyXia"><span>Cercle NyXia</span></a>
  <div class="card">
    <h1>Connexion</h1>
    <p class="sub">Accède à ton espace d’entraide</p>
    <label for="email">Courriel</label>
    <input id="email" type="email" autocomplete="email" placeholder="toi@email.com">
    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <button type="button" class="btn" id="btn" onclick="doLogin()">Entrer</button>
    <div class="msg" id="msg"></div>
    <p class="foot">Pas encore de compte ?<br><a href="/inscription.html">Commencer mes 3 jours offerts</a></p>
  </div>
</div>
<script src="/starry-bg.js" defer></script>
<script>
(function(){
  if (sessionStorage.getItem('nyxia_token')) { location.href='/dashbord.html'; return; }
  window.doLogin = async function(){
    var btn=document.getElementById('btn'), msg=document.getElementById('msg');
    var email=document.getElementById('email').value.trim();
    var password=document.getElementById('password').value;
    msg.className='msg';
    if(!email||!password){ msg.textContent='Courriel et mot de passe requis.'; msg.className='msg err'; return; }
    btn.disabled=true;
    try{
      var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
      var data=await r.json().catch(function(){return{}});
      if(!r.ok||data.error){ msg.textContent=data.error||'Identifiants incorrects.'; msg.className='msg err'; btn.disabled=false; return; }
      if(data.token) sessionStorage.setItem('nyxia_token', data.token);
      location.href='/dashbord.html';
    }catch(e){ msg.textContent='Réseau indisponible.'; msg.className='msg err'; btn.disabled=false; }
  };
  document.getElementById('password').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
})();
</script>
</body>
</html>
