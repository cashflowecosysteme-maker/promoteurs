<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produits à partager — Cercle</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1628;--card:rgba(123,92,255,.06);--border:rgba(123,92,255,.15);--p:#7B5CFF;--p2:#5A6CFF;--t:#fff;--t2:#D6D9F0;--t3:#8891B8;--green:#00E676}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--t2);padding:24px;line-height:1.5}
h1{font-family:'Space Grotesk',sans-serif;color:#fff;font-size:1.4rem;margin-bottom:8px}
.sub{color:var(--t3);font-size:.9rem;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{color:#fff;font-size:1.05rem;margin-bottom:6px}
.price{color:var(--green);font-weight:600;font-size:.95rem;margin-bottom:10px}
code{display:block;padding:10px;border-radius:10px;background:rgba(6,10,24,.6);border:1px solid var(--border);color:#fff;font-size:.78rem;word-break:break-all;margin:8px 0}
.btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(123,92,255,.15);color:#fff;cursor:pointer;font-family:Outfit,sans-serif;font-size:.85rem}
.btn-main{background:linear-gradient(135deg,var(--p),var(--p2));border:none;font-weight:600}
.empty{color:var(--t3);padding:24px;text-align:center}
.badge{display:inline-block;padding:4px 10px;border-radius:50px;background:rgba(123,92,255,.2);color:#c4b5fd;font-size:12px;margin-bottom:12px}
</style>
</head><body>
<h1>📦 Produits à partager</h1>
<p class="sub">Chaque lien porte <strong style="color:#fff">ton code unique</strong> — c’est ainsi qu’on sait qui a fait la promotion et qui doit être relié aux revenus.</p>
<div class="badge" id="codeBadge">Code : …</div>
<div id="list" class="empty">Chargement…</div>
<script>
(async function(){
  var token=sessionStorage.getItem('nyxia_token')||'';
  var myCode='';

  function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function money(n){return Number(n||0).toLocaleString('fr-CA',{minimumFractionDigits:2,maximumFractionDigits:2})+' $';}
  function withRef(url, code){
    if(!url) return '';
    if(!code) return url;
    try{
      var u=new URL(url, location.origin);
      u.searchParams.set('ref', code);
      return u.toString();
    }catch(e){
      return url+(url.indexOf('?')>=0?'&':'?')+'ref='+encodeURIComponent(code);
    }
  }
  function shareLink(p, code){
    // Lien promo Répertoire avec empreinte unique
    var base='https://repertoire.nyxia.top/?product='+encodeURIComponent(p.id)+'&ref='+encodeURIComponent(code);
    return base;
  }
  function offerLink(p, code){
    if(!p.affiliate_link) return '';
    return withRef(p.affiliate_link, code);
  }

  var auth=await fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json','X-Cercle-Token':token},body:JSON.stringify({token:token})}).then(function(r){return r.json()}).catch(function(){return{}});
  myCode=(auth.code||auth.affiliate_code||'').toString().trim().toUpperCase();
  document.getElementById('codeBadge').textContent=myCode?('Ton code unique : '+myCode):'Code manquant — reconnecte-toi';
  if(!myCode){
    document.getElementById('list').textContent='Impossible d’afficher les liens sans ton code parrain.';
    return;
  }

  var data={};
  try{
    data=await fetch('https://repertoire.nyxia.top/api/repertoire').then(function(r){return r.json()});
  }catch(e){
    try{ data=await fetch('/api/repertoire').then(function(r){return r.json()}); }catch(e2){ data={products:[]}; }
  }
  var products=data.products||[];
  var box=document.getElementById('list');
  if(!products.length){ box.textContent='Aucun produit publié pour le moment.'; return; }
  box.className='';
  box.innerHTML=products.map(function(p){
    var promo=shareLink(p, myCode);
    var offer=offerLink(p, myCode);
    return '<div class="card">'
      +'<h3>'+esc(p.title)+'</h3>'
      +'<div class="price">'+money(p.price)+'</div>'
      +'<div style="font-size:12px;color:var(--t3)">Ton lien de promotion (empreinte '+esc(myCode)+')</div>'
      +'<code>'+esc(promo)+'</code>'
      +'<button type="button" class="btn btn-main" data-copy="'+esc(promo)+'">Copier mon lien</button> '
      +'<a class="btn" href="'+esc(promo)+'" target="_blank" rel="noopener">Ouvrir</a>'
      +(offer?('<div style="font-size:12px;color:var(--t3);margin-top:12px">Lien d’offre avec ton code</div><code>'+esc(offer)+'</code>'):'')
      +'</div>';
  }).join('');
  box.querySelectorAll('[data-copy]').forEach(function(btn){
    btn.onclick=function(){
      navigator.clipboard.writeText(btn.getAttribute('data-copy'));
      btn.textContent='Copié ✓';
      setTimeout(function(){ btn.textContent='Copier mon lien'; },1500);
    };
  });
})();
</script>
</body></html>
